name: release exe (download link)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy Pillow python-docx pypdf chardet charset-normalizer
      - name: Run tests
        run: python -m pytest tests/ -v

  release-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", architecture: x64 }
      - name: Install dependencies
        run: |
          pip install -r requirements.txt pyinstaller
          pip install pywin32 pystray
      - name: Generate icon (if missing)
        run: python scripts/make_icon.py
      - name: Build ConFas.exe
        run: python build.py
      - name: Record build commit + timestamp (for freshness checks)
        shell: pwsh
        run: |
          $sha = git rev-parse HEAD
          $ts  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $tag = "${{ github.event.inputs.tag }}"
          if (-not $tag) { $tag = "${{ github.ref_name }}" }
          Set-Content -Path build-info.txt -Value "commit=$sha`nbuilt_at=$ts`ntag=$tag"
      - name: Create / update GitHub Release with the EXE
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/ConFas.exe
            build-info.txt
          body: |
            ## ConFas Windows EXE

            Direct download (always the newest release):
            https://github.com/${{ github.repository }}/releases/latest/download/ConFas.exe

            Built from commit `${{ github.sha }}`.
