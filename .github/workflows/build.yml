name: build & test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install test dependencies (slim = same matrix as verified local runs)
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy Pillow python-docx pypdf chardet charset-normalizer
      - name: Run tests
        run: python -m pytest tests/ -v

  exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", architecture: x64 }
      - name: Install dependencies
        run: |
          pip install -r requirements.txt pyinstaller
          pip install pywin32 pystray
      - name: Generate icon (if missing)
        run: python scripts/make_icon.py
      - name: Build ConFas.exe
        run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: ConFas-windows-exe
          path: dist/ConFas.exe
