name: cloud learnings merge (every 6 h)
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy
      - name: Recompute merged.json from contrib-*.json files
        env:
          CONFAS_GIST_ID: ${{ secrets.CONFAS_GIST_ID }}
          CONFAS_CLOUD_TOKEN: ${{ secrets.CONFAS_CLOUD_TOKEN }}
        run: PYTHONPATH=src python -m confas.cloud --merge-gist
